name: Build image
# Publishes to this Gitea server's own container registry:
#   <gitea-host>/<owner>/<repo>:latest
# Needs a secret named REGISTRY_TOKEN: a Gitea access token with the write:package scope
# (Repository → Settings → Actions → Secrets). Falls back to the built-in token if it is allowed to write packages.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name
        id: img
        run: |
          host=$(echo "${{ gitea.server_url }}" | sed -E 's#^https?://##; s#/$##')
          repo=$(echo "${{ gitea.repository }}" | tr 'A-Z' 'a-z')
          echo "name=$host/$repo" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.img.outputs.host }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || gitea.token }}

      - name: Tags
        id: tags
        run: |
          t="${{ steps.img.outputs.name }}:latest"
          if [ "${{ gitea.ref_type }}" = "tag" ]; then t="$t,${{ steps.img.outputs.name }}:${{ gitea.ref_name }}"; fi
          echo "list=$t" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
